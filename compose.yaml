# 8star Chat v1.0.0 — Compose stack for Dockhand ("From Git") or docker compose.
#
# The image is built from the repository checkout this file is in, so a
# Dockhand Git stack (repository + tag + compose.yaml) builds and deploys in
# one step. Without Git: run `docker compose up -d --build` in the release folder.
# The data volume has a fixed name, so the existing data is used whatever the
# stack/project is called. Never remove this volume when removing a stack.
services:
  8star-chat:
    build:
      context: .
      dockerfile: Dockerfile
    image: 8star-chat:1.0.0
    restart: unless-stopped
    ports:
      - "9876:3000"
    environment:
      PORT: "3000"
      DATA_DIR: /data
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Dockhand}
      DEFAULT_MAX_USERS: ${DEFAULT_MAX_USERS:-10000}
      MAX_MESSAGE_LENGTH: ${MAX_MESSAGE_LENGTH:-500}
      # Production currently runs with 50 accepted public messages per second
      # per event. This release does not change that value.
      ROOM_PUBLISH_PER_SECOND: ${ROOM_PUBLISH_PER_SECOND:-50}
      FRAME_ANCESTORS: "${FRAME_ANCESTORS:-*}"
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      GUEST_SESSION_HOURS: ${GUEST_SESSION_HOURS:-24}
      PRIVATE_UNLOCK_IDLE_SECONDS: ${PRIVATE_UNLOCK_IDLE_SECONDS:-900}
      # New in 0.7.0 (defaults shown; see README "Settings").
      JOURNAL_FSYNC: ${JOURNAL_FSYNC:-true}
      FANOUT_INTERVAL_MS: ${FANOUT_INTERVAL_MS:-100}
      OVERLOAD_LAG_MS: ${OVERLOAD_LAG_MS:-1000}
      MAX_PENDING_MESSAGES: ${MAX_PENDING_MESSAGES:-1000}
      MAX_PENDING_EVENTS: ${MAX_PENDING_EVENTS:-5000}
      SSE_MAX_BUFFER_KB: ${SSE_MAX_BUFFER_KB:-256}
      LISTEN_BACKLOG: ${LISTEN_BACKLOG:-4096}
      # One JSON line with counts and timings per minute in `docker logs`.
      METRICS_LOG_SECONDS: ${METRICS_LOG_SECONDS:-60}
    volumes:
      - 8star_chat_data:/data
    # Each live attendee holds one open connection (Server-Sent Events).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  8star_chat_data:
    # Existing production volume (created by the stack "8star-chat").
    name: 8star-chat_8star_chat_data
