# 8star Chat v0.6.0 — Compose stack for Dockhand / docker compose.
#
# The image is built on the Docker host from the release source
# (see README: "Install or update on the server"). Keep the service name,
# volume name and stack name unchanged so the existing data volume is reused.
services:
  8star-chat:
    image: 8star-chat:0.6.0
    pull_policy: never
    restart: unless-stopped
    ports:
      - "9876:3000"
    environment:
      PORT: "3000"
      DATA_DIR: /data
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Dockhand}
      DEFAULT_MAX_USERS: ${DEFAULT_MAX_USERS:-10000}
      MAX_MESSAGE_LENGTH: ${MAX_MESSAGE_LENGTH:-500}
      ROOM_PUBLISH_PER_SECOND: ${ROOM_PUBLISH_PER_SECOND:-5}
      FRAME_ANCESTORS: "${FRAME_ANCESTORS:-*}"
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      GUEST_SESSION_HOURS: ${GUEST_SESSION_HOURS:-24}
      PRIVATE_UNLOCK_IDLE_SECONDS: ${PRIVATE_UNLOCK_IDLE_SECONDS:-900}
    volumes:
      - 8star_chat_data:/data
    # Each live attendee holds one open connection (Server-Sent Events).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  8star_chat_data:
